<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc"><title id="title">CyberSOC AI simplified architecture</title><desc id="desc">Wazuh, Suricata, Docker and ZAP feed FastAPI analysis; incidents are stored in PostgreSQL and displayed in Next.js.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#168bb6" stroke-width="1.7"/></marker><style>text{font-family:Arial,sans-serif;fill:#092b4d}.head{font-size:21px;font-weight:700}.sub{font-size:14px;fill:#536f82}.pill{font-size:15px;font-weight:700}.arrow{stroke:#168bb6;stroke-width:3;fill:none;marker-end:url(#arr)}.box{fill:#fff;stroke:#b6ddea;stroke-width:2}.accent{fill:#ecfaff;stroke:#75cce4;stroke-width:2}</style></defs><rect width="1040" height="360" rx="22" fill="#f8fdff"/><text x="45" y="49" class="head">Security sources</text><text x="390" y="49" class="head">CyberSOC AI</text><text x="777" y="49" class="head">Dashboard</text><g><rect class="box" x="40" y="82" width="240" height="212" rx="20"/><g fill="#e7f8fd"><rect x="58" y="103" width="204" height="36" rx="9"/><rect x="58" y="148" width="204" height="36" rx="9"/><rect x="58" y="193" width="204" height="36" rx="9"/><rect x="58" y="238" width="204" height="36" rx="9"/></g><text class="pill" x="160" y="127" text-anchor="middle">Wazuh</text><text class="pill" x="160" y="172" text-anchor="middle">Suricata</text><text class="pill" x="160" y="217" text-anchor="middle">Docker logs</text><text class="pill" x="160" y="262" text-anchor="middle">OWASP ZAP</text></g><path class="arrow" d="M285 190H360"/><g><rect class="accent" x="375" y="94" width="270" height="185" rx="22"/><text class="head" x="510" y="137" text-anchor="middle">FastAPI backend</text><text class="sub" x="510" y="173" text-anchor="middle">Collect &amp; normalize alerts</text><text class="sub" x="510" y="202" text-anchor="middle">Detect &amp; classify incidents</text><text class="sub" x="510" y="231" text-anchor="middle">Calculate security scores</text></g><path class="arrow" d="M648 190H730"/><g><rect class="box" x="748" y="83" width="252" height="105" rx="19"/><text class="head" x="874" y="125" text-anchor="middle">Next.js</text><text class="sub" x="874" y="154" text-anchor="middle">SOC dashboard</text><rect class="box" x="748" y="211" width="252" height="83" rx="19"/><text class="head" x="874" y="247" text-anchor="middle">PostgreSQL</text><text class="sub" x="874" y="272" text-anchor="middle">Events &amp; incidents</text></g><path d="M700 190v63h40" class="arrow"/><text class="sub" x="520" y="332" text-anchor="middle">One platform to monitor, analyze and manage security events</text></svg>